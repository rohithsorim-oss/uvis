vehicles:
  get:
    tags:
      - Vehicle
    summary: List Vehicles
    operationId: getVehicles

    parameters:
      - name: search
        in: query
        schema:
          type: string

      - name: status
        in: query
        schema:
          type: string
          enum:
            - AVAILABLE
            - SOLD
            - RESERVED

      - name: categoryId
        in: query
        schema:
          type: integer
          format: int64

      - name: minYear
        in: query
        schema:
          type: integer

      - name: maxYear
        in: query
        schema:
          type: integer

      - name: sortBy
        in: query
        schema:
          type: string
          default: createdAt

      - name: sortDir
        in: query
        schema:
          type: string
          enum:
            - asc
            - desc
          default: desc

      - name: page
        in: query
        schema:
          type: integer
          default: 0

      - name: size
        in: query
        schema:
          type: integer
          default: 20

    responses:
      '200':
        description: Vehicle list retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/vehicle-schema.yml#/VehicleResponse'

  post:
    tags:
      - Vehicle
    summary: Create Vehicle
    operationId: createVehicle

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/vehicle-schema.yml#/VehicleRequest'

    responses:
      '201':
        description: Vehicle created successfully

